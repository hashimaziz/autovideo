<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>screencast cursor probe</title>
<style>
  /* Tall enough to prove the capture is viewport-only, dark enough that a white
     OS cursor arrow would be unmistakable against it. */
  body {
    margin: 0;
    background: #101418;
    color: #e8eef5;
    font: 16px monospace;
    min-height: 3000px;
  }
  p { padding: 16px; }

  .box {
    position: absolute;
    width: 220px;
    height: 90px;
    background: #2f6feb;
    color: #fff;
    font-size: 26px;
    line-height: 90px;
    text-align: center;
    border-radius: 8px;
  }
</style>
<body>
  <p>screencast cursor probe</p>
  <!-- The mouse sweep crosses this box: any captured cursor must be over it. -->
  <div class="box" style="left: 120px; top: 180px">TARGET</div>
  <div class="box" style="left: 60px; top: 520px">OTHER</div>
</body>
</html>
