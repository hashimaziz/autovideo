<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>autovideo fixture — highlighting</title>
    <style>
      body {
        margin: 0;
        background: #0b1020;
        color: #e6ecf7;
        font:
          16px -apple-system,
          Arial,
          sans-serif;
      }
      /* Tall enough that scrolling is possible, which is the case that matters: a highlight that
         does not follow a scroll is the bug this fixture exists to catch. */
      .spacer {
        height: 1800px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #55607d;
      }
      #target,
      #other {
        width: 320px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #151d33;
        border: 1px solid #2a3557;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="spacer">scroll down</div>
    <div id="target">target</div>
    <div class="spacer" style="height: 600px">between</div>
    <div id="other">other target</div>
    <div class="spacer">end</div>
  </body>
</html>
